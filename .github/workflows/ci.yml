name: CI

on:
  # Every branch, not just main: a feature branch with no PR open would otherwise get no signal
  # at all, which is when the feedback is most useful.
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Agent adapters are current
        run: pnpm sync:agent --check
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: No dead code
        run: pnpm knip
